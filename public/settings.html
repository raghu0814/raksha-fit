<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raksha Fit Settings</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="dashboard.html">RAKSHA <span>FIT</span></a><nav><a href="dashboard.html">Dashboard</a><button id="logout">Logout</button></nav></header><main><div id="toast" role="status"></div><p class="eyebrow">OWNER SETTINGS</p><h1>Gym configuration</h1><div class="grid two"><article><h2>Gym profile and retention</h2><form id="settingsForm" class="stack"><label>Gym name<input name="name" required></label><label>Phone<input name="phone" required></label><label>Email<input name="email" type="email"></label><label>Address<textarea name="address"></textarea></label><label>Absent after (days)<input name="inactivity_threshold_days" type="number" min="1" max="90" required></label><label>Expiry reminder (days before)<input name="expiry_reminder_days" type="number" min="1" max="30" required></label><button class="primary">Save settings</button></form></article><article><h2>Add staff</h2><form id="staffForm" class="stack"><label>Name<input name="name" required></label><label>Mobile<input name="phone" required></label><label>Temporary password<input name="password" type="password" minlength="8" required></label><button class="primary">Create staff account</button></form><h2 class="spaced">Staff accounts</h2><div id="staffList" class="list"></div></article></div></main><script src="settings.js"></script></body></html>
