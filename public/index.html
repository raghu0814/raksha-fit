<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raksha Fit</title><link rel="stylesheet" href="styles.css"></head><body class="auth-page"><main class="auth-card"><a class="brand">RAKSHA <span>FIT</span></a><p class="eyebrow">GYM MANAGEMENT, SIMPLIFIED</p><h1 id="authTitle">Owner login</h1><form id="loginForm"><label>Mobile number<input name="phone" inputmode="numeric" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button class="primary">Login</button></form><p id="authMessage"></p><p>New to Raksha Fit? <button class="link" id="showRegister">Create your gym</button></p><form id="registerForm" hidden><label>Gym name<input name="gym_name" required></label><label>Gym mobile<input name="gym_phone" inputmode="numeric" required></label><label>Your name<input name="name" required></label><label>Your mobile<input name="phone" inputmode="numeric" required></label><label>Password<input name="password" type="password" minlength="8" required></label><label>Email (optional)<input name="email" type="email"></label><label>Address (optional)<textarea name="address"></textarea></label><button class="primary">Create gym and account</button></form><p><button class="link" id="showLogin" hidden>Back to login</button></p></main><script src="auth.js"></script></body></html>
